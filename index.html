<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <header>
        <h1 class="heading-primary heading-lg"><a href="#">Equilibrium #3429</a></h1>
      </header>
      <div class="card__media">
        <a href="https://google.com">
          <img src="./images/image-equilibrium.jpg" alt="Equilibrium glass cube">
        </a>
      </div>
      <div class="card__content space">
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <ul>
          <li>
            <img src="./images/icon-ethereum.svg" alt="Ethereum icon" class="icon">
            0.041 ETH
          </li>
          <li>
            <img src="images/icon-clock.svg" alt=" Clock icon" class="icon">
            3 days left
          </li>
        </ul>
      </div>
      <div class="card__divider"></div>
      <footer class="card__footer">
        <img src="./images/image-avatar.png" alt="" class="card__avatar">
        <span>
          Creation of <a href="#">Jules Wyvern</a>
        </span>
      </footer>
    </article>
  </main>

  <!-- <div class="attribution">
  Challenge by 
  <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">
    Frontend Mentor
  </a>. 
  Coded by 
  <a href="https://github.com/metchadou">
    Franklin Metch
  </a>.
</div> -->
</body>
</html>
